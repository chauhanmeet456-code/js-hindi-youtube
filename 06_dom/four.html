<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Aur Code | Dome</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>JavaScript</li>
    </ul>
</body>

<script>
    function addLanguage(langName) {
        const li = document.createElement('li');
        li.innerHTML = `${langName}`;
        document.querySelector('.language').
        appendChild(li);
    }
    addLanguage('Python');
    addLanguage('Java');

    function addOptiLang(LangName) {
    const li = document.createElement('li');
    li.appendChild(document.createTextNode(LangName));
    document.querySelector('.language').appendChild(li);
    }
    addOptiLang('PHP');

    //Edit
    const secLang = document.querySelector("li:nth-child(2)");
    // secLand.innerHTML = "C++";
    const newli = document.createElement('li');
    newli.textContent = "ABCD";
    secLang.replaceWith(newli);

    //edit
    const firstLang = document.querySelector("li:first-child");
    //firstLang.textContent = "TypeScript";
    //firstLang.innerHTML = "TypeScript"; 
    firstLang.outerHTML = "<li>TypeScript</li>";

    //remove
    const lastlang = document.querySelector("li:last-child");
    lastlang.remove();
</script>

</html>
